# ==============================================================================
# NGINX PRODUCTION CONFIGURATION FOR SUPREME LAW DIGEST (SLD SYSTEM)
# Reverse Proxy, TLS Termination, Keepalive Pool & Security Hardening
# ==============================================================================

# Upstream connection pool with HTTP/1.1 persistent keepalives
upstream sld_backend_nodes {
    server 127.0.0.1:5000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 75s;
}

server {
    listen 80;
    # Replace with your actual domain (e.g., api.supremelawdigest.com) or Hostinger VPS IP
    server_name api.supremelawdigest.com api.yourdomain.com _;

    # Maximum allowed request payload (supports document & PDF uploads)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip dynamic compression for JSON and textual payloads >= 1KB
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/plain
        text/css
        text/xml
        application/xml;

    # Defense-in-depth HTTP security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Do not cache authenticated API responses in public intermediary proxies
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;

    # Buffer tuning for high-throughput responses without temporary disk thrashing
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    location / {
        proxy_pass http://sld_backend_nodes;
        proxy_http_version 1.1;

        # WebSocket & connection reuse
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded identity headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large search queries, heavy aggregations, or document exports
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Disable cache bypass for standard proxy
        proxy_cache_bypass $http_upgrade;
    }

    # Lightweight health probe endpoint
    location /api/health {
        proxy_pass http://sld_backend_nodes/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
